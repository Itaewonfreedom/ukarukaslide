name: Android CI

on:
  push:
    branches: [ main, feature/fold-hologram ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android source
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Build debug APK on manual request
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ukarukaslide-debug
          path: app/build/outputs/apk/debug/app-debug.apk
